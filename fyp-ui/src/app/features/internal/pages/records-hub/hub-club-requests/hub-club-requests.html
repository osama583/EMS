@if (errorMessage()) { <app-feedback-banner tone="error" [message]="errorMessage()" /> }

<app-internal-data-page
  [config]="config()"
  [records]="records()"
  [filters]="filters()"
  [searchValue]="search()"
  [sort]="sort()"
  (sortChange)="setSort($event)"
  [loading]="loading()"
  [totalPages]="totalPages()"
  [page]="page()"
  [pageSize]="pageSize()"
  (searchChange)="setSearch($event)"
  (filterChange)="setFilter($event)"
  (reset)="reset()"
  (pageChange)="setPage($event)"
  (pageSizeChange)="setPageSize($event)"
  (rowAction)="handleAction($event)"
/>

<app-confirm-dialog
  [open]="!!approveTarget()"
  title="Approve join request"
  [message]="approveTarget() ? ('Approve ' + approveTarget()!.requester.displayName + ' to join ' + approveTarget()!.clubName + '? They become a member immediately.') : ''"
  confirmLabel="Approve"
  [danger]="false"
  [loading]="!!processingId()"
  (confirm)="confirmApprove()"
  (cancel)="closeApprove()"
/>

<app-proposal-comment-dialog
  [open]="!!rejectTarget()" title="Reject Join Request" label="Reason for rejection" confirmLabel="Reject" [danger]="true" [loading]="rejecting()"
  [message]="rejectTarget() ? ('Tell ' + rejectTarget()!.requester.displayName + ' why this request is being rejected. They will see this reason.') : ''"
  [minLength]="rejectionCommentMinLength"
  (cancel)="closeReject()" (confirm)="confirmReject($event)"
/>
