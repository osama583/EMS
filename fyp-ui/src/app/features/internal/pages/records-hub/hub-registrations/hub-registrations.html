@if (errorMessage()) { <app-feedback-banner tone="error" [message]="errorMessage()" /> }

<app-internal-data-page
  [config]="config()"
  [records]="records()"
  [filters]="filters()"
  [searchValue]="search()"
  [loading]="loading()"
  [totalPages]="totalPages()"
  [page]="currentPage()"
  [pageSize]="pageSize()"
  (searchChange)="setSearch($event)"
  (filterChange)="setFilter($event)"
  (reset)="reset()"
  (pageChange)="setPage($event)"
  (pageSizeChange)="setPageSize($event)"
  (rowAction)="handleAction($event)"
  (cellClick)="handleCellClick($event)"
/>

<app-confirm-dialog
  [open]="pendingAction() !== null"
  [title]="confirmTitle()"
  [message]="confirmMessage()"
  [confirmLabel]="pendingAction()?.action === 'reject' ? 'Reject' : 'Approve'"
  [danger]="pendingAction()?.action === 'reject'"
  [loading]="processing()"
  (confirm)="confirmAction()"
  (cancel)="cancelAction()"
/>

@if (proofPreview(); as registration) {
  <app-form-modal
    [open]="true"
    title="Payment proof"
    [hidePrimary]="true"
    secondaryLabel="Close"
    [fixedSize]="true"
    (close)="closeProofPreview()"
    (cancel)="closeProofPreview()"
    (submit)="closeProofPreview()"
  >
    <p class="proof-preview__meta">{{ registration.name || registration.email }} · {{ registration.eventTitle }}</p>
    @if (registration.paymentProofUrl) {
      <button type="button" class="proof-preview__link" (click)="openImageLightbox()">
        <img class="proof-preview__image" [src]="registration.paymentProofUrl" [alt]="'Payment proof from ' + (registration.name || registration.email)" />
      </button>
      <button type="button" class="proof-preview__open" (click)="openImageLightbox()">
        <span class="material-symbols-rounded" aria-hidden="true">zoom_in</span>
        View full size
      </button>
    }
  </app-form-modal>
}

@if (imageLightboxOpen() && proofPreview(); as registration) {
  <div
    #imageLightbox
    class="proof-image-lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Payment proof preview"
    tabindex="-1"
    (click)="closeImageLightbox()"
    (keydown.escape)="closeImageLightbox()"
  >
    <figure (click)="$event.stopPropagation()">
      <img [src]="registration.paymentProofUrl" [alt]="'Payment proof from ' + (registration.name || registration.email)" />
      <figcaption>{{ registration.name || registration.email }} · {{ registration.eventTitle }}</figcaption>
      <button type="button" aria-label="Close image preview" (click)="closeImageLightbox()">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </figure>
  </div>
}
