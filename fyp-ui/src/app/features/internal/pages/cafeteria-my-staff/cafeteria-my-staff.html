<section class="cafeteria-my-staff">
  <app-feedback-banner [message]="errorMessage()" tone="error" />

  <app-internal-data-page
    [config]="config()" [records]="records()" [filters]="[]" [searchValue]="search()" [loading]="loading()"
    [totalPages]="totalPages()" [page]="page()" [pageSize]="pageSize()"
    (searchChange)="setSearch($event)" (reset)="reset()"
    (pageChange)="setPage($event)" (pageSizeChange)="setPageSize($event)" (rowAction)="handleAction($event)"
    (primaryAction)="openAdd()"
  />
</section>

<app-form-modal
  [open]="modalOpen()" [title]="isEditing() ? 'Edit Staff' : 'Add Staff'"
  [primaryLabel]="isEditing() ? 'Save Changes' : 'Add Staff'" [loading]="saving()" [disabled]="!formValid()"
  (close)="closeModal()" (cancel)="closeModal()" (submit)="save()"
>
  <div class="cafeteria-my-staff__form">
    <app-form-field controlId="my-staff-name" label="Full Name" [required]="true" [value]="value('displayName')" (valueChange)="setDraft('displayName', $event)" />
    <app-form-field controlId="my-staff-email" label="Email" type="email" [required]="true" [value]="value('email')" (valueChange)="setDraft('email', $event)" />
    <app-form-field controlId="my-staff-password" label="Password" type="password" [value]="value('password')" [hint]="passwordHint()" (valueChange)="setDraft('password', $event)" />
    <app-status-toggle [active]="$any(draft()['active'])" label="Active user" description="Inactive users remain listed but cannot sign in." (activeChange)="setDraft('active', $event)" />
  </div>
</app-form-modal>

<app-form-modal
  [open]="!!statusTarget()" [title]="(statusActionLabel() === 'restore' ? 'Restore' : 'Suspend') + ' staff'"
  [primaryLabel]="statusActionLabel() === 'restore' ? 'Restore' : 'Suspend'" [loading]="changingStatus()"
  (close)="cancelStatus()" (cancel)="cancelStatus()" (submit)="confirmStatus()"
>
  <div class="cafeteria-my-staff__form">
    <p>{{ statusActionLabel() === 'restore' ? 'Restore' : 'Suspend' }} <strong>{{ statusTarget()?.displayName }}</strong>?</p>
    <p class="cafeteria-my-staff__hint">
      Suspending keeps the person on your roster but stops their cafeteria access until they are restored. It does not delete anything.
    </p>
  </div>
</app-form-modal>

<app-form-modal [open]="!!removeTarget()" title="Remove Staff" primaryLabel="Remove" [danger]="true" [loading]="removing()" (close)="cancelRemove()" (cancel)="cancelRemove()" (submit)="confirmRemove()">
  <div class="cafeteria-my-staff__form">
    <p>Remove <strong>{{ removeTarget()?.displayName }}</strong> from your cafeteria?</p>
  </div>
</app-form-modal>
