<section class="internal-page" [attr.aria-labelledby]="'internal-page-title'">
  <header class="internal-page__header">
    <p>{{ eyebrow }}</p>
    <h1 id="internal-page-title">{{ title }}</h1>
    <span>{{ description }}</span>
  </header>

  <div class="internal-page__placeholder">
    <span class="material-symbols-rounded" aria-hidden="true">{{ icon }}</span>
    <div>
      <h2>{{ title }}</h2>
      <p>The page container and navigation route are ready for the next implementation phase.</p>
    </div>
  </div>
</section>
