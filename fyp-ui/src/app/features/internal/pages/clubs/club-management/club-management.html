<section class="club-management">
  <app-feedback-banner [message]="errorMessage()" tone="error" />

  <app-internal-page-header [config]="cardHeaderConfig()" (primaryAction)="openAdd()" />

  <div class="club-management__view-row">
    <app-view-toggle [mode]="viewMode()" (modeChange)="setViewMode($event)" />
    <div class="club-management__header-actions">
      <button type="button" class="table-control club-management__categories-btn" (click)="openCategoryManager()">
        <span class="material-symbols-rounded" aria-hidden="true">sell</span>
        Manage categories
      </button>
      <button type="button" class="table-control table-control--primary club-management__add-desktop" (click)="openAdd()">
        <span class="material-symbols-rounded" aria-hidden="true">add</span>
        Add club
      </button>
    </div>
  </div>

  <section class="internal-table-workspace__controls club-management__controls">
    <div workspaceControls class="shared-page-controls">
      <app-internal-search-field
        workspaceControlWide
        [config]="{ ariaLabel: 'Search clubs', placeholder: 'Search club name, description, or president' }"
        [value]="search()"
        (valueChange)="setSearch($event)"
      />
      <div workspaceControlRight class="shared-page-controls__right">
        <app-internal-filter-controls [filters]="filters()" (filterChange)="setFilter($event)" />
        <div class="shared-page-controls__actions">
          <button type="button" class="table-control table-control--primary club-management__add-mobile" (click)="openAdd()">
            <span class="material-symbols-rounded" aria-hidden="true">add</span>
            Add club
          </button>
          <app-internal-reset-button (reset)="reset()" />
        </div>
      </div>
    </div>
  </section>

  @if (viewMode() === 'card') {
    <app-option-card-grid
      [items]="cardData()" [loading]="loading()"
      emptyTitle="No clubs found" emptyDescription="Add a club or change the search and status filters."
      (edit)="editClub($event)"
      (toggleActive)="toggleActiveById($event)"
    />
  } @else {
    <app-internal-data-page
      [config]="config()" [records]="records()" [filters]="filters()" [searchValue]="search()" [loading]="loading()"
      [totalPages]="totalPages()" [page]="page()" [pageSize]="pageSize()"
      [hideHeader]="true"
      [hideControls]="true"
      (searchChange)="setSearch($event)" (filterChange)="setFilter($event)" (reset)="reset()"
      (pageChange)="setPage($event)" (pageSizeChange)="setPageSize($event)" (rowAction)="handleAction($event)"
      (recordOpen)="handleAction({ action: { key: 'edit', label: 'Edit club', icon: 'edit' }, record: $event })"
      (primaryAction)="openAdd()"
    />
  }
</section>

<app-form-modal
  [open]="modalOpen()" [title]="editingId() ? 'Edit club' : 'Add club'"
  [primaryLabel]="editingId() ? 'Save Changes' : 'Add Club'" [loading]="saving()" [disabled]="!formValid()"
  (close)="closeModal()" (cancel)="closeModal()" (submit)="save()"
>
  <div class="club-management__form">
    <app-form-field controlId="club-name" label="Club Name" type="text" [required]="true" [value]="draft().name" (valueChange)="setDraft('name', $event)" />
    <app-form-field controlId="club-description" label="Description" type="textarea" [rows]="4" [value]="draft().description" (valueChange)="setDraft('description', $event)" />
    <app-searchable-dropdown
      controlId="club-president" label="President" [required]="true"
      placeholder="Select a student or lecturer"
      [options]="presidentOptions()" [value]="draft().presidentUserId"
      (valueChange)="setDraft('presidentUserId', $any($event))"
    />
    <app-searchable-dropdown
      controlId="club-category" label="Categories" [required]="true"
      placeholder="Select 1 to 3 categories"
      hint="Choose between 1 and 3 categories for this club."
      [isMulti]="true" [maxSelections]="3"
      [options]="categoryOptions()" [value]="draft().categoryIds"
      (valueChange)="setDraftCategoryIds($any($event))"
    />
    <app-image-upload-field
      controlId="club-image"
      label="Club Image"
      hint="PNG, JPG or WebP · maximum 5 MB"
      emptyMessage="Add a picture for this club"
      [imagePreview]="draft().imageUrl"
      [imageFileName]="draft().imageFileName"
      [error]="imageError()"
      (fileSelect)="selectImageFile($event)"
      (remove)="removeImage()"
    />
    <app-status-toggle [active]="draft().active" label="Active club" description="Only active clubs appear on the Clubs browse page." (activeChange)="setDraft('active', $event)" />
  </div>
</app-form-modal>

<app-club-category-manager [open]="categoryManagerOpen()" [currentUserId]="currentUserId" (close)="closeCategoryManager()" />
