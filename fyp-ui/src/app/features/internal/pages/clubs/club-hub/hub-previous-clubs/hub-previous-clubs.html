@if (errorMessage()) { <app-feedback-banner tone="error" [message]="errorMessage()" /> }

<app-internal-data-page
  [config]="config()"
  [records]="records()"
  [filters]="filters()"
  [searchValue]="search()"
  [loading]="loading()"
  [totalPages]="totalPages()"
  [page]="page()"
  [pageSize]="pageSize()"
  [sort]="sort()"
  (searchChange)="setSearch($event)"
  (filterChange)="setFilter($event)"
  (sortChange)="setSort($event)"
  (reset)="reset()"
  (pageChange)="setPage($event)"
  (pageSizeChange)="setPageSize($event)"
/>
