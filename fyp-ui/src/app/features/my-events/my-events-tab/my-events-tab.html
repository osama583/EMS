@if (loading()) {
  <app-internal-page-state [loading]="true" [showClear]="false" />
} @else if (error()) {
  <app-internal-page-state icon="error" title="Unable to load events" [description]="error()" [showClear]="false" />
} @else if (entries().length === 0) {
  <app-internal-page-state [icon]="emptyIcon()" [title]="emptyTitle()" [description]="emptyDescription()" [showClear]="false" />
} @else {
  <section class="explore-grid" [attr.aria-label]="mode() + ' events'">
    @for (entry of entries(); track entry.event.id) {
      <app-event-card
        [event]="entry.event"
        [saved]="isSaved(entry.event.id)"
        [registrationStatus]="entry.status"
        [registering]="registeringEventId() === entry.event.id"
        [showRegister]="mode() !== 'history'"
        (favourite)="toggleSaved($event)"
        (explore)="selectedEvent.set(entry.event)"
        (register)="registerForEvent($event)"
      />
    }
  </section>
}

<app-event-details-modal [open]="!!selectedEvent()" [event]="selectedEvent()" (close)="selectedEvent.set(null)" />
