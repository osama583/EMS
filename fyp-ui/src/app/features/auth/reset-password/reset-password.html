<main class="login-page reset-password-page">
  <section class="login-marketing" aria-label="APU Event Management System">
    <h1>Choose a new password</h1>
  </section>

  <section class="login-access">
    <div class="login-form reset-password-form">
      <header class="login-form__header">
        <a class="login-brand" href="/" aria-label="Return to APU Events home">
          <img src="/assets/media/apu-logo-only.png" alt="" width="1254" height="1254" />
          <img src="/assets/media/logo-text-black.webp" alt="Asia Pacific University" width="2008" height="783" />
        </a>
        <p>APU Event Management System</p>
        <h2>Reset your password</h2>
      </header>

      @if (stage() === 'form') {
        <form novalidate (submit)="$event.preventDefault(); submit()">
          <div class="login-form__fields">
            <app-form-field
              controlId="reset-password" name="password" label="New password" type="password"
              autocomplete="new-password" [required]="true" [value]="password()" [error]="passwordError()"
              hint="Use at least 8 characters." (valueChange)="password.set($event)"
            />
            <app-form-field
              controlId="reset-password-confirm" name="confirmPassword" label="Confirm new password" type="password"
              autocomplete="new-password" [required]="true" [value]="confirmPassword()" [error]="confirmError()"
              (valueChange)="confirmPassword.set($event)"
            />
          </div>
          <button class="table-control table-control--primary login-form__submit" type="submit" [disabled]="submitting() || !formValid()">
            @if (submitting()) { <span class="material-symbols-rounded login-form__spinner" aria-hidden="true">progress_activity</span> }
            {{ submitting() ? 'Resetting…' : 'Reset password' }}
          </button>
        </form>
      } @else if (stage() === 'success') {
        <div class="reset-password-result">
          <span class="material-symbols-rounded reset-password-result__icon reset-password-result__icon--success" aria-hidden="true">check_circle</span>
          <p>{{ serverMessage() }}</p>
          <button class="table-control table-control--primary" type="button" (click)="goToLogin()">Go to sign in</button>
        </div>
      } @else {
        <div class="reset-password-result">
          <span class="material-symbols-rounded reset-password-result__icon reset-password-result__icon--error" aria-hidden="true">error</span>
          <p>{{ serverMessage() }}</p>
          <button class="table-control table-control--primary" type="button" (click)="goToLogin()">Back to sign in</button>
        </div>
      }

      <footer class="login-form__footer">Copyright {{ year }} Asia Pacific University of Technology & Innovation</footer>
    </div>
  </section>
</main>
