<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence — write-path integrity and notification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{display:flex;justify-content:center;padding:24px 18px}
  svg{width:100%;max-width:1400px;height:auto;display:block}

  .ll   {font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;letter-spacing:.05em;text-transform:uppercase;fill:#141A20}
  .ll-s {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10px;fill:#8A939D}
  .msg  {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.5px;fill:#243039}
  .ret  {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.5px;fill:#5A6672}
  .frag {font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;fill:#27456F}
  .cond {font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:11px;fill:#4E6A93}
  .note {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10.5px;fill:#8A939D}
  .warn {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11px;fill:#8E3A22}
  .phase{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;letter-spacing:.16em;text-transform:uppercase;fill:#4E6A93}
  .tx   {font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;fill:#8E3A22}

  .head {fill:#E4EAF2;stroke:#27456F;stroke-width:1.5}
  .life {stroke:#8FA0B4;stroke-width:1.2;stroke-dasharray:5 5}
  .actv {fill:#FFFFFF;stroke:#27456F;stroke-width:1.3}
  .call {stroke:#27456F;stroke-width:1.5;fill:none}
  .back {stroke:#7C8DA1;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
  .bad  {stroke:#C08670;stroke-width:1.4;fill:none;stroke-dasharray:6 4}
  .txb  {fill:none;stroke:#8E3A22;stroke-width:1.6;stroke-dasharray:8 5}
  .nbox {fill:#FFFDF9;stroke:#C08670;stroke-width:1.3}
  .pl   {stroke:#AFBAC4;stroke-width:1;stroke-dasharray:3 3}
</style>
</head>
<body>

<svg viewBox="0 0 1400 1120" role="img"
     aria-label="Sequence diagram: transactional write path and post-commit notification">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27456F"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7C8DA1" stroke-width="1.4"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#C08670" stroke-width="1.4"/></marker>
  </defs>

  <!-- ══════ LIFELINES ══════ -->
  <rect class="head" x="24"   y="40" width="150" height="46" rx="2"/>
  <text class="ll"   x="99"  y="62" text-anchor="middle">Client</text>
  <line class="life" x1="99" y1="86" x2="99" y2="1090"/>

  <rect class="head" x="214"  y="40" width="170" height="46" rx="2"/>
  <text class="ll"   x="299" y="62" text-anchor="middle">Blueprint</text>
  <text class="ll-s" x="299" y="78" text-anchor="middle">api/proposals.py</text>
  <line class="life" x1="299" y1="86" x2="299" y2="1090"/>

  <rect class="head" x="424"  y="40" width="170" height="46" rx="2"/>
  <text class="ll"   x="509" y="62" text-anchor="middle">Workflow</text>
  <text class="ll-s" x="509" y="78" text-anchor="middle">services/workflow</text>
  <line class="life" x1="509" y1="86" x2="509" y2="1090"/>

  <rect class="head" x="634"  y="40" width="170" height="46" rx="2"/>
  <text class="ll"   x="719" y="62" text-anchor="middle">Db</text>
  <text class="ll-s" x="719" y="78" text-anchor="middle">app/db.transaction()</text>
  <line class="life" x1="719" y1="86" x2="719" y2="1090"/>

  <rect class="head" x="844"  y="40" width="170" height="46" rx="2"/>
  <text class="ll"   x="929" y="62" text-anchor="middle">PostgreSQL</text>
  <line class="life" x1="929" y1="86" x2="929" y2="1090"/>

  <rect class="head" x="1054" y="40" width="170" height="46" rx="2"/>
  <text class="ll"   x="1139" y="62" text-anchor="middle">Email</text>
  <text class="ll-s" x="1139" y="78" text-anchor="middle">services/email</text>
  <line class="life" x1="1139" y1="86" x2="1139" y2="1090"/>

  <rect class="head" x="1254" y="40" width="120" height="46" rx="2"/>
  <text class="ll"   x="1314" y="62" text-anchor="middle">SMTP</text>
  <line class="life" x1="1314" y1="86" x2="1314" y2="1090"/>

  <!-- ══════ pre-transaction ══════ -->
  <text class="phase" x="24" y="118">Validate before opening a transaction</text>
  <line class="pl" x1="24" y1="128" x2="1380" y2="128"/>

  <rect class="actv" x="94"  y="150" width="10" height="820"/>
  <rect class="actv" x="294" y="152" width="10" height="800"/>

  <path class="call" d="M104,160 H294" marker-end="url(#a)"/>
  <text class="msg" x="116" y="154">POST /api/v1/proposals</text>

  <path class="call" d="M304,192 H354 V182 H304" marker-end="url(#a)"/>
  <text class="msg" x="364" y="188">authenticate() · load Principal</text>

  <path class="call" d="M304,232 H354 V222 H304" marker-end="url(#a)"/>
  <text class="msg" x="364" y="228">validate the submitted form</text>
  <text class="note" x="364" y="246">a rejected payload never reaches the database</text>

  <!-- ══════ transaction ══════ -->
  <rect class="txb" x="256" y="278" width="720" height="380" rx="3"/>
  <text class="tx" x="272" y="302">Single transaction — all or nothing</text>

  <rect class="actv" x="504" y="330" width="10" height="300"/>
  <rect class="actv" x="714" y="332" width="10" height="292"/>

  <path class="call" d="M304,340 H504" marker-end="url(#a)"/>
  <text class="msg" x="316" y="334">create_request(principal, form)</text>

  <path class="call" d="M514,372 H714" marker-end="url(#a)"/>
  <text class="msg" x="526" y="366">with transaction() as cur</text>

  <path class="call" d="M724,404 H924" marker-end="url(#a)"/>
  <text class="msg" x="736" y="398">INSERT request</text>

  <path class="call" d="M724,442 H924" marker-end="url(#a)"/>
  <text class="msg" x="736" y="436">INSERT requirement child rows</text>
  <text class="note" x="736" y="454">logistics · transportation · fmb · campus tour · …</text>

  <path class="call" d="M724,494 H924" marker-end="url(#a)"/>
  <text class="msg" x="736" y="488">INSERT workflow_history</text>

  <rect class="nbox" x="330" y="508" width="380" height="72" rx="2"/>
  <text class="warn" x="346" y="528">The audit row is written inside the same</text>
  <text class="warn" x="346" y="546">transaction as the state change it records,</text>
  <text class="warn" x="346" y="564">so the two can never disagree.</text>

  <path class="call" d="M724,600 H924" marker-end="url(#a)"/>
  <text class="msg" x="736" y="594">COMMIT</text>

  <path class="bad" d="M714,636 H320" marker-end="url(#ax)"/>
  <text class="warn" x="336" y="630">any exception → ROLLBACK, nothing persisted</text>

  <!-- ══════ post-commit ══════ -->
  <text class="phase" x="24" y="700">After commit — notification, never before</text>
  <line class="pl" x1="24" y1="710" x2="1380" y2="710"/>

  <rect class="actv" x="1134" y="742" width="10" height="150"/>

  <path class="call" d="M304,752 H1134" marker-end="url(#a)"/>
  <text class="msg" x="320" y="746">proposal_awaiting_review(…)</text>

  <path class="call" d="M1144,786 H924" marker-end="url(#a)"/>
  <text class="msg" x="940" y="780">resolve recipients for the stage</text>

  <path class="call" d="M1144,824 H1309" marker-end="url(#a)"/>
  <text class="msg" x="1000" y="818">send()</text>

  <path class="bad" d="M1309,860 H1149" marker-end="url(#ax)"/>
  <text class="warn" x="960" y="854">failure → logged, never raised</text>

  <path class="back" d="M294,930 H104" marker-end="url(#ao)"/>
  <text class="ret" x="120" y="924">201 created — the response does not wait on mail</text>

  <!-- ══════ note ══════ -->
  <rect class="nbox" x="24" y="980" width="960" height="94" rx="3"/>
  <text class="tx"   x="44" y="1006">Why the ordering matters</text>
  <text class="warn" x="44" y="1030">Sending inside the transaction would mail a reviewer about a proposal a later exception then rolled back.</text>
  <text class="warn" x="44" y="1050">Raising on a mail failure would turn a healthy write into a 500. Approving a proposal must not fail</text>
  <text class="warn" x="44" y="1068">because the mail server is down, so send() returns a boolean and logs rather than raising.</text>

</svg>
</body>
</html>
