<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deployment and layered architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{display:flex;justify-content:center;padding:24px 18px}
  svg{width:100%;max-width:1240px;height:auto;display:block}

  .t-node   {font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:23px;letter-spacing:.045em;text-transform:uppercase;fill:#141A20}
  .t-node-s {font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:19px;letter-spacing:.05em;text-transform:uppercase;fill:#141A20}
  .t-tier   {font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:10.5px;letter-spacing:.19em;text-transform:uppercase;fill:#4E6A93}
  .t-code   {font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:13px;fill:#27456F}
  .t-chip   {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.5px;fill:#57626E}
  .t-dim    {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.5px;fill:#8A939D}
  .t-edge   {font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:15px;letter-spacing:.11em;text-transform:uppercase;fill:#27456F}
  .t-edge-s {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:12px;fill:#6B7681}
  .t-ext    {font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:21px;letter-spacing:.05em;text-transform:uppercase;fill:#8E3A22}
  .t-ext-s  {font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;fill:#B5735E}
  .t-warn   {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.5px;fill:#8E3A22}
  .t-idx    {font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:20px;letter-spacing:.05em;fill:#27456F}
  .t-idx-s  {font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:8.5px;letter-spacing:.12em;fill:#7B93B4}

  .card     {fill:#FFFFFF;stroke:#27456F;stroke-width:1.6}
  .card-in  {fill:#FDFDFC;stroke:#AFBAC4;stroke-width:1.1}
  .strip    {fill:#E4EAF2}
  .group    {fill:#F7F9FB;stroke:#27456F;stroke-width:1.8}
  .ext      {fill:#FFFFFF;stroke:#C08670;stroke-width:1.6;stroke-dasharray:7 5}
  .rule     {stroke:#AFBAC4;stroke-width:1.1}
  .rule-b   {stroke:#27456F;stroke-width:1.6}
  .edge     {stroke:#27456F;stroke-width:1.8;fill:none}
  .edge-ext {stroke:#C08670;stroke-width:1.6;fill:none;stroke-dasharray:7 5}
  .ico      {fill:none;stroke:#27456F;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ico-ext  {fill:none;stroke:#8E3A22;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .depth    {fill:#E4EAF2}
</style>
</head>
<body>

<svg viewBox="0 0 1230 1078" role="img"
     aria-label="Deployment and layered architecture of the APU Event Management System">

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27456F"/>
    </marker>
    <marker id="ah-ext" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C08670"/>
    </marker>
  </defs>

  <!-- ══════════════ USERS ══════════════ -->
  <g transform="translate(226,34)">
    <circle class="ico" cx="0" cy="10" r="8.5"/>
    <path   class="ico" d="M-15,34 a15,15 0 0,1 30,0"/>
  </g>
  <text class="t-node-s" x="226" y="98"  text-anchor="middle">Users</text>
  <text class="t-chip"   x="226" y="118" text-anchor="middle">students · staff · reviewers · admins · guests</text>

  <path class="edge" d="M226,132 L226,166" marker-end="url(#ah)"/>

  <!-- ══════════════ TIER 1 — CLIENT ══════════════ -->
  <rect class="card"  x="52" y="170" width="348" height="140" rx="2"/>
  <rect class="strip" x="52.8" y="170.8" width="346.4" height="30"/>
  <line class="rule"  x1="52" y1="200.8" x2="400" y2="200.8"/>
  <text class="t-tier" x="70" y="191">Tier 1 · browser</text>

  <g transform="translate(72,218)">
    <rect   class="ico" x="0" y="0" width="30" height="24" rx="2"/>
    <line   class="ico" x1="0" y1="7.5" x2="30" y2="7.5"/>
    <circle cx="5"  cy="3.8" r="1.4" fill="#27456F"/>
    <circle cx="10" cy="3.8" r="1.4" fill="#27456F"/>
  </g>
  <text class="t-node" x="114" y="238">Angular SPA</text>
  <text class="t-chip" x="114" y="256">@angular/core 21.2</text>
  <text class="t-chip" x="72"  y="280">router · auth.interceptor · token-store</text>
  <text class="t-chip" x="72"  y="297">core/ services · features/ pages</text>

  <!-- client ─▶ server -->
  <path class="edge" d="M226,310 L226,392" marker-end="url(#ah)"/>
  <text class="t-edge"   x="246" y="334">HTTPS · JSON</text>
  <text class="t-edge-s" x="246" y="353">/api/v1 · Authorization: Bearer &lt;JWT&gt;</text>
  <text class="t-edge-s" x="246" y="371">X-Request-Id · CORS restricted to exact origins</text>

  <!-- ══════════════ TIER 2 — APPLICATION SERVER ══════════════ -->
  <rect class="group" x="52" y="396" width="760" height="420" rx="2"/>
  <rect class="strip" x="52.9" y="396.9" width="758.2" height="38"/>
  <line class="rule"  x1="52" y1="434.9" x2="812" y2="434.9"/>

  <g transform="translate(74,405)">
    <rect class="ico" x="0" y="2" width="26" height="20" rx="2"/>
    <line class="ico" x1="5" y1="8"  x2="21" y2="8"/>
    <line class="ico" x1="5" y1="13" x2="21" y2="13"/>
    <line class="ico" x1="5" y1="18" x2="14" y2="18"/>
  </g>
  <text class="t-node" x="112" y="424">Application Server</text>
  <text class="t-tier" x="794" y="422" text-anchor="end">Tier 2 · Flask 3.1 · gunicorn</text>

  <!-- cross-cutting -->
  <rect class="card-in" x="74" y="452" width="716" height="66" rx="2"/>
  <text class="t-tier" x="90" y="471">Cross-cutting · every request</text>
  <text class="t-chip" x="90" y="492">CORS, exact origins · rate limit per user else IP · request id + timing</text>
  <text class="t-chip" x="90" y="509">security headers · structured log, redacted · error envelope · 12 MiB cap</text>

  <!-- L1 -->
  <rect class="card-in" x="74" y="530" width="540" height="92" rx="2"/>
  <rect class="depth"   x="74.6" y="530.6" width="42" height="90.8"/>
  <line class="rule-b"  x1="116.6" y1="530.6" x2="116.6" y2="621.4"/>
  <text class="t-idx"   x="95" y="566" text-anchor="middle">L1</text>
  <text class="t-idx-s" x="95" y="580" text-anchor="middle">API</text>
  <text class="t-node-s" x="132" y="554">Blueprints</text>
  <text class="t-code"   x="228" y="554">app/api/</text>
  <text class="t-chip"   x="132" y="575">auth · proposals · tasks · cafeteria-orders · cafeterias</text>
  <text class="t-chip"   x="132" y="592">catalog · options · admin · dashboard · events · clubs</text>
  <text class="t-chip"   x="132" y="609">uploads · ai · ai-admin</text>

  <!-- L2 -->
  <rect class="card-in" x="74" y="628" width="540" height="78" rx="2"/>
  <rect class="depth"   x="74.6" y="628.6" width="42" height="76.8"/>
  <line class="rule-b"  x1="116.6" y1="628.6" x2="116.6" y2="705.4"/>
  <text class="t-idx"   x="95" y="660" text-anchor="middle">L2</text>
  <text class="t-idx-s" x="95" y="674" text-anchor="middle">DOMAIN</text>
  <text class="t-node-s" x="132" y="652">Services</text>
  <text class="t-code"   x="216" y="652">app/services/</text>
  <text class="t-chip"   x="132" y="673">workflow — stages · tasks · fmb · authorization · history</text>
  <text class="t-chip"   x="132" y="690">dashboard · email · identity · soft_delete</text>

  <!-- L3 -->
  <rect class="card-in" x="74" y="712" width="540" height="78" rx="2"/>
  <rect class="depth"   x="74.6" y="712.6" width="42" height="76.8"/>
  <line class="rule-b"  x1="116.6" y1="712.6" x2="116.6" y2="789.4"/>
  <text class="t-idx"   x="95" y="744" text-anchor="middle">L3</text>
  <text class="t-idx-s" x="95" y="758" text-anchor="middle">DATA</text>
  <text class="t-node-s" x="132" y="736">Access</text>
  <text class="t-code"   x="204" y="736">app/db.py</text>
  <text class="t-chip"   x="132" y="757">psycopg2 pool min 1 / max 10 · transaction() per write</text>
  <text class="t-chip"   x="132" y="774">parameter binding only, never interpolation</text>

  <!-- ai/ rail -->
  <rect class="card-in" x="630" y="530" width="160" height="260" rx="2"/>
  <rect class="strip"   x="630.6" y="530.6" width="158.8" height="28"/>
  <line class="rule"    x1="630" y1="558.6" x2="790" y2="558.6"/>
  <text class="t-node-s" x="644" y="551">Assistant</text>
  <text class="t-code"   x="746" y="551">ai/</text>
  <text class="t-chip" x="644" y="580">classifier</text>
  <text class="t-chip" x="644" y="598">topic_access</text>
  <text class="t-chip" x="644" y="616">scope_rules</text>
  <text class="t-chip" x="644" y="634">schema_catalog</text>
  <text class="t-chip" x="644" y="652">sql_llm</text>
  <text class="t-chip" x="644" y="670">sql_guard</text>
  <text class="t-chip" x="644" y="688">sql_runner</text>
  <line class="rule" x1="644" y1="706" x2="776" y2="706" stroke-dasharray="3 3"/>
  <text class="t-dim" x="644" y="726">parallel stack —</text>
  <text class="t-dim" x="644" y="743">reaches the database</text>
  <text class="t-dim" x="644" y="760">through L3</text>

  <!-- ══════════════ EXTERNAL SERVICES ══════════════ -->
  <path class="edge-ext" d="M812,540 L938,540" marker-end="url(#ah-ext)"/>
  <path class="edge-ext" d="M812,720 L938,720" marker-end="url(#ah-ext)"/>
  <text class="t-edge-s" x="818" y="530">assistant queries</text>
  <text class="t-edge-s" x="818" y="710">outbound mail</text>

  <rect class="ext" x="944" y="470" width="274" height="140" rx="2"/>
  <g transform="translate(968,494)">
    <path class="ico-ext" d="M11,0 L14,8 L22,11 L14,14 L11,22 L8,14 L0,11 L8,8 Z"/>
  </g>
  <text class="t-ext-s" x="1004" y="496">External</text>
  <text class="t-ext"   x="1004" y="516">Google Gemini</text>
  <text class="t-chip"  x="968" y="546">models/gemini-3.1-flash-lite</text>
  <text class="t-chip"  x="968" y="565">google-genai SDK, HTTPS</text>
  <text class="t-dim"   x="968" y="590">two keys · sticky failover on 429</text>

  <rect class="ext" x="944" y="650" width="274" height="140" rx="2"/>
  <g transform="translate(968,674)">
    <rect class="ico-ext" x="0" y="2" width="22" height="16" rx="1.5"/>
    <path class="ico-ext" d="M0,4 L11,12 L22,4"/>
  </g>
  <text class="t-ext-s" x="1004" y="676">External</text>
  <text class="t-ext"   x="1004" y="696">SMTP Relay</text>
  <text class="t-chip"  x="968" y="726">STARTTLS · port 587</text>
  <text class="t-chip"  x="968" y="745">workflow notifications</text>
  <text class="t-dim"   x="968" y="770">sent after commit; never raised</text>

  <!-- ══════════════ SERVER ─▶ DATABASE ══════════════ -->
  <path class="edge" d="M300,816 L300,900" marker-end="url(#ah)"/>
  <text class="t-edge"   x="320" y="840">TCP · pooled</text>
  <text class="t-edge-s" x="320" y="859">psycopg2 ThreadedConnectionPool</text>
  <text class="t-edge-s" x="320" y="877">keepalives tuned for the Supabase pooler</text>

  <!-- ══════════════ TIER 3 — DATABASE ══════════════ -->
  <rect class="card"  x="52" y="904" width="560" height="155" rx="2"/>
  <line class="rule-b" x1="52" y1="910.5" x2="612" y2="910.5"/>
  <rect class="strip" x="52.8" y="911.3" width="558.4" height="30"/>
  <line class="rule"  x1="52" y1="941.3" x2="612" y2="941.3"/>
  <text class="t-tier" x="70" y="932">Tier 3 · managed</text>

  <g transform="translate(72,958)">
    <ellipse class="ico" cx="13" cy="5" rx="13" ry="5"/>
    <path    class="ico" d="M0,5 L0,21 a13,5 0 0,0 26,0 L26,5"/>
    <path    class="ico" d="M0,13 a13,5 0 0,0 26,0"/>
  </g>
  <text class="t-node" x="114" y="978">Supabase PostgreSQL</text>
  <text class="t-chip" x="114" y="996">33 ordered migrations · migrations/run.py</text>
  <text class="t-chip" x="72"  y="1020">identity &amp; roles · request aggregate · tasks &amp; workflow_history</text>
  <text class="t-chip" x="72"  y="1039">clubs &amp; registrations · cafeterias &amp; menus · navigation catalog</text>

  <!-- ══════════════ CONSTRAINT ANNOTATION ══════════════ -->
  <path class="edge-ext" d="M700,940 C664,908 648,838 620,774" marker-end="url(#ah-ext)"/>
  <text class="t-ext-s" x="700" y="946">Constraint</text>
  <text class="t-warn"  x="700" y="970">blueprints never issue SQL directly — only</text>
  <text class="t-warn"  x="700" y="988">services/workflow writes workflow_history,</text>
  <text class="t-warn"  x="700" y="1006">in the same transaction as the state change</text>

</svg>

</body>
</html>
