<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity — requirement fulfilment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{display:flex;justify-content:center;padding:24px 18px}
  svg{width:100%;max-width:1420px;height:auto;display:block}

  .band {font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;letter-spacing:.15em;text-transform:uppercase;fill:#27456F}
  .lane {font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;letter-spacing:.13em;text-transform:uppercase;fill:#4E6A93}
  .ac   {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.5px;fill:#243039}
  .stt  {font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:10px;fill:#4E6A93}
  .gd   {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10.5px;fill:#5A6672}
  .dc   {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10.5px;fill:#243039}
  .note {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10.5px;fill:#8A939D}
  .fin  {font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;fill:#141A20}

  .lanebg{fill:#F8FAFB}
  .lanel {stroke:#AFBAC4;stroke-width:1.2}
  .div   {stroke:#27456F;stroke-width:2.4}
  .act   {fill:#FFFFFF;stroke:#27456F;stroke-width:1.5}
  .dia   {fill:#FFFFFF;stroke:#27456F;stroke-width:1.5}
  .fl    {stroke:#27456F;stroke-width:1.6;fill:none}
  .fl-b  {stroke:#7C8DA1;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
  .nbox  {fill:#FFFFFF;stroke:#AFBAC4;stroke-width:1.1;stroke-dasharray:4 4}
</style>
</head>
<body>

<svg viewBox="0 0 1420 1840" role="img"
     aria-label="Activity diagram: department task and cafeteria order fulfilment">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27456F"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C8DA1"/></marker>
  </defs>

  <!-- ═══════════════════ BAND A ═══════════════════ -->
  <text class="band" x="40" y="28">Band A · Department task</text>

  <rect class="lanebg" x="40" y="40" width="340" height="940"/>
  <rect class="lanebg" x="720" y="40" width="340" height="940"/>
  <line class="lanel" x1="40"   y1="40" x2="40"   y2="980"/>
  <line class="lanel" x1="380"  y1="40" x2="380"  y2="980"/>
  <line class="lanel" x1="720"  y1="40" x2="720"  y2="980"/>
  <line class="lanel" x1="1060" y1="40" x2="1060" y2="980"/>
  <line class="lanel" x1="40" y1="40"  x2="1060" y2="40"/>
  <line class="lanel" x1="40" y1="80"  x2="1060" y2="80"/>
  <line class="lanel" x1="40" y1="980" x2="1060" y2="980"/>

  <text class="lane" x="210" y="67" text-anchor="middle">Department head</text>
  <text class="lane" x="550" y="67" text-anchor="middle">Department staff</text>
  <text class="lane" x="890" y="67" text-anchor="middle">Applicant</text>

  <circle cx="210" cy="118" r="11" fill="#27456F"/>
  <text class="note" x="234" y="114">from the fork in Fig. 6 —</text>
  <text class="note" x="234" y="128">one flow per requirement</text>
  <path class="fl" d="M210,129 V152" marker-end="url(#a)"/>

  <rect class="act" x="115" y="156" width="190" height="52" rx="10"/>
  <text class="stt" x="210" y="176" text-anchor="middle">pending</text>
  <text class="ac"  x="210" y="194" text-anchor="middle">Review the task</text>

  <path class="fl" d="M210,208 V244" marker-end="url(#a)"/>
  <path class="dia" d="M210,248 L296,296 L210,344 L124,296 Z"/>
  <text class="dc" x="210" y="300" text-anchor="middle">decision?</text>

  <!-- send back to the applicant -->
  <path class="fl-b" d="M296,296 H890 V340" marker-end="url(#ab)"/>
  <text class="gd" x="330" y="288">[send back with comment]</text>

  <rect class="act" x="795" y="344" width="190" height="52" rx="10"/>
  <text class="stt" x="890" y="364" text-anchor="middle">resubmitted</text>
  <text class="ac"  x="890" y="382" text-anchor="middle">Fix these items</text>

  <path class="fl-b" d="M890,396 V444 H340 V182 H309" marker-end="url(#ab)"/>
  <text class="note" x="404" y="462">back to pending — sibling tasks keep working throughout</text>

  <!-- approve -->
  <path class="fl" d="M210,344 V392" marker-end="url(#a)"/>
  <text class="gd" x="220" y="370">[approve]</text>

  <rect class="act" x="115" y="396" width="190" height="60" rx="10"/>
  <text class="stt" x="210" y="418" text-anchor="middle">approved</text>
  <text class="ac"  x="210" y="436" text-anchor="middle">Assign staff</text>
  <text class="ac"  x="210" y="450" text-anchor="middle">to the task</text>

  <path class="fl" d="M210,456 V488" marker-end="url(#a)"/>
  <path class="dia" d="M210,492 L306,548 L210,604 L114,548 Z"/>
  <text class="dc" x="210" y="542" text-anchor="middle">row-assignable</text>
  <text class="dc" x="210" y="556" text-anchor="middle">requirement?</text>

  <path class="fl" d="M210,604 V636" marker-end="url(#a)"/>
  <text class="gd" x="220" y="628">[yes]</text>

  <rect class="act" x="115" y="640" width="190" height="60" rx="10"/>
  <text class="ac" x="210" y="662" text-anchor="middle">Assign staff to</text>
  <text class="ac" x="210" y="676" text-anchor="middle">individual rows</text>
  <text class="note" x="210" y="692" text-anchor="middle">per-type assignee cap</text>

  <!-- both routes converge on the staff lane, always downward -->
  <path class="fl" d="M306,548 H588 V704" marker-end="url(#a)"/>
  <text class="gd" x="330" y="540">[no]</text>
  <path class="fl" d="M305,670 H512 V704" marker-end="url(#a)"/>

  <rect class="act" x="455" y="708" width="190" height="52" rx="10"/>
  <text class="stt" x="550" y="728" text-anchor="middle">preparing</text>
  <text class="ac"  x="550" y="746" text-anchor="middle">Start preparing</text>

  <path class="fl" d="M550,760 V792" marker-end="url(#a)"/>
  <rect class="act" x="455" y="796" width="190" height="52" rx="10"/>
  <text class="stt" x="550" y="816" text-anchor="middle">completed</text>
  <text class="ac"  x="550" y="834" text-anchor="middle">Complete the task</text>

  <path class="fl" d="M550,848 V876" marker-end="url(#a)"/>
  <circle cx="550" cy="900" r="15" fill="none" stroke="#27456F" stroke-width="1.6"/>
  <circle cx="550" cy="900" r="9" fill="#27456F"/>
  <text class="fin" x="550" y="938" text-anchor="middle">task terminal</text>

  <rect class="nbox" x="1080" y="156" width="320" height="122" rx="3"/>
  <text class="lane" x="1098" y="182">Join condition</text>
  <text class="note" x="1098" y="208">When every sibling task on the proposal</text>
  <text class="note" x="1098" y="224">reaches a terminal state, the parent</text>
  <text class="note" x="1098" y="240">request auto-completes to</text>
  <text class="stt"  x="1098" y="262">completed_approved  (Fig. 6 join)</text>

  <rect class="nbox" x="1080" y="486" width="320" height="152" rx="3"/>
  <text class="lane" x="1098" y="512">Row-assignable</text>
  <text class="note" x="1098" y="538">Five of the seven routed requirements</text>
  <text class="note" x="1098" y="554">allow assignment row by row:</text>
  <text class="stt"  x="1098" y="576">logistics · transportation</text>
  <text class="stt"  x="1098" y="592">photoVideo · soundLight</text>
  <text class="stt"  x="1098" y="608">campusTour</text>
  <text class="note" x="1098" y="628">transportation caps at one assignee.</text>

  <rect class="nbox" x="1080" y="700" width="320" height="122" rx="3"/>
  <text class="lane" x="1098" y="726">No rejection here</text>
  <text class="note" x="1098" y="752">A department can approve or send back,</text>
  <text class="note" x="1098" y="768">and nothing else. Ending a proposal is</text>
  <text class="note" x="1098" y="784">reserved to the three single-actor</text>
  <text class="note" x="1098" y="800">reviewer stages in Fig. 6.</text>

  <!-- ═══════════════════ DIVIDER ═══════════════════ -->
  <line class="div" x1="40" y1="1030" x2="1400" y2="1030"/>

  <!-- ═══════════════════ BAND B ═══════════════════ -->
  <text class="band" x="40" y="1076">Band B · F&amp;B and cafeteria order</text>

  <rect class="lanebg" x="40" y="1088" width="340" height="690"/>
  <rect class="lanebg" x="720" y="1088" width="340" height="690"/>
  <line class="lanel" x1="40"   y1="1088" x2="40"   y2="1778"/>
  <line class="lanel" x1="380"  y1="1088" x2="380"  y2="1778"/>
  <line class="lanel" x1="720"  y1="1088" x2="720"  y2="1778"/>
  <line class="lanel" x1="1060" y1="1088" x2="1060" y2="1778"/>
  <line class="lanel" x1="40" y1="1088" x2="1060" y2="1088"/>
  <line class="lanel" x1="40" y1="1128" x2="1060" y2="1128"/>
  <line class="lanel" x1="40" y1="1778" x2="1060" y2="1778"/>

  <text class="lane" x="210" y="1115" text-anchor="middle">F&amp;B head</text>
  <text class="lane" x="550" y="1115" text-anchor="middle">Cafeteria manager</text>
  <text class="lane" x="890" y="1115" text-anchor="middle">Cafeteria staff</text>

  <circle cx="210" cy="1166" r="11" fill="#27456F"/>
  <text class="note" x="234" y="1170">F&amp;B task approved in Band A</text>
  <path class="fl" d="M210,1177 V1204" marker-end="url(#a)"/>

  <rect class="act" x="115" y="1208" width="190" height="60" rx="10"/>
  <text class="ac" x="210" y="1230" text-anchor="middle">Fan out one menu</text>
  <text class="ac" x="210" y="1244" text-anchor="middle">selection per cafeteria</text>
  <text class="note" x="210" y="1260" text-anchor="middle">request_fmb_selection</text>

  <path class="fl" d="M305,1238 H550 V1270" marker-end="url(#a)"/>

  <rect class="act" x="455" y="1274" width="190" height="60" rx="10"/>
  <text class="stt" x="550" y="1296" text-anchor="middle">pending</text>
  <text class="ac"  x="550" y="1314" text-anchor="middle">Review each order</text>
  <text class="note" x="550" y="1330" text-anchor="middle">independently</text>

  <path class="fl" d="M550,1334 V1366" marker-end="url(#a)"/>
  <path class="dia" d="M550,1370 L636,1418 L550,1466 L464,1418 Z"/>
  <text class="dc" x="550" y="1422" text-anchor="middle">decision?</text>

  <path class="fl-b" d="M464,1418 H210 V1450" marker-end="url(#ab)"/>
  <text class="gd" x="250" y="1410">[send back]</text>

  <rect class="act" x="115" y="1454" width="190" height="60" rx="10"/>
  <text class="stt" x="210" y="1476" text-anchor="middle">resubmitted</text>
  <text class="ac"  x="210" y="1494" text-anchor="middle">Edit and re-send</text>
  <text class="note" x="210" y="1510" text-anchor="middle">manager_comment cleared</text>

  <path class="fl-b" d="M305,1484 H420 V1300 H451" marker-end="url(#ab)"/>

  <path class="fl" d="M550,1466 V1498" marker-end="url(#a)"/>
  <text class="gd" x="560" y="1490">[approve]</text>

  <rect class="act" x="455" y="1502" width="190" height="60" rx="10"/>
  <text class="stt" x="550" y="1524" text-anchor="middle">approved</text>
  <text class="ac"  x="550" y="1542" text-anchor="middle">Enters shared pool</text>
  <text class="note" x="550" y="1558" text-anchor="middle">visible to that outlet&#39;s staff</text>

  <path class="fl" d="M645,1532 H890 V1180" marker-end="url(#a)"/>

  <path class="dia" d="M890,1184 L976,1232 L890,1280 L804,1232 Z"/>
  <text class="dc" x="890" y="1228" text-anchor="middle">already</text>
  <text class="dc" x="890" y="1242" text-anchor="middle">claimed?</text>

  <path class="fl" d="M976,1232 H1016 V1196" marker-end="url(#a)"/>
  <text class="gd" x="990" y="1186">[yes]</text>
  <text class="gd" x="990" y="1172">taken</text>

  <path class="fl" d="M890,1280 V1314" marker-end="url(#a)"/>
  <text class="gd" x="900" y="1304">[no]</text>

  <rect class="act" x="795" y="1318" width="190" height="60" rx="10"/>
  <text class="stt" x="890" y="1340" text-anchor="middle">preparing</text>
  <text class="ac"  x="890" y="1358" text-anchor="middle">Claim and prepare</text>
  <text class="note" x="890" y="1374" text-anchor="middle">claimed_by_user_id set</text>

  <path class="fl" d="M890,1378 V1410" marker-end="url(#a)"/>
  <rect class="act" x="795" y="1414" width="190" height="52" rx="10"/>
  <text class="stt" x="890" y="1434" text-anchor="middle">ready</text>
  <text class="ac"  x="890" y="1452" text-anchor="middle">Mark ready</text>

  <path class="fl" d="M890,1466 V1498" marker-end="url(#a)"/>
  <rect class="act" x="795" y="1502" width="190" height="60" rx="10"/>
  <text class="stt" x="890" y="1524" text-anchor="middle">fulfilled</text>
  <text class="ac"  x="890" y="1542" text-anchor="middle">Deliver the order</text>
  <text class="note" x="890" y="1558" text-anchor="middle">delivery proof recorded</text>

  <path class="fl" d="M890,1562 V1596" marker-end="url(#a)"/>
  <circle cx="890" cy="1620" r="15" fill="none" stroke="#27456F" stroke-width="1.6"/>
  <circle cx="890" cy="1620" r="9" fill="#27456F"/>
  <text class="fin" x="890" y="1658" text-anchor="middle">order terminal</text>

  <rect class="nbox" x="1080" y="1200" width="320" height="176" rx="3"/>
  <text class="lane" x="1098" y="1226">Concurrent claiming</text>
  <text class="note" x="1098" y="1252">Sibling orders on one proposal are in</text>
  <text class="note" x="1098" y="1268">flight at once and may be claimed by</text>
  <text class="note" x="1098" y="1284">different people. The claim is resolved</text>
  <text class="note" x="1098" y="1300">by a database row lock, so exactly one</text>
  <text class="note" x="1098" y="1316">staff member wins and the rest see the</text>
  <text class="note" x="1098" y="1332">order already taken.</text>
  <text class="note" x="1098" y="1356">workflow_history is scoped to request_id</text>
  <text class="note" x="1098" y="1370">and cannot tell siblings apart.</text>

  <rect class="nbox" x="1080" y="1420" width="320" height="140" rx="3"/>
  <text class="lane" x="1098" y="1446">Per-selection review</text>
  <text class="note" x="1098" y="1472">Each cafeteria decides only its own</text>
  <text class="note" x="1098" y="1488">order. One outlet sending an order back</text>
  <text class="note" x="1098" y="1504">does not stall the others, which is why</text>
  <text class="note" x="1098" y="1520">the pushback comment lives on the</text>
  <text class="note" x="1098" y="1536">selection row rather than on the request.</text>

</svg>
</body>
</html>
