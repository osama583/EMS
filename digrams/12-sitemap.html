  <!-- ══════════ MECHANISM ══════════ -->
  <rect class="nbox" x="22" y="800" width="780" height="200" rx="3"/>
  <text class="key"  x="42" y="828">How visibility is decided</text>
  <text class="note" x="42" y="856">Nothing above is hardcoded in the client. Every entry is a nav_page row, and it appears for a</text>
  <text class="note" x="42" y="874">caller only if one of its nav_page_grants matches — either a flat role, or a (role, unit) pair.</text>
  <text class="note" x="42" y="898">A folder carries grants of its own, and they gate all of its children as a group: a caller who</text>
  <text class="note" x="42" y="916">fails the folder&#39;s check sees none of the pages beneath it.</text>
  <text class="note" x="42" y="946">route_path is derived server-side as /app/&lt;page_code&gt; and is never supplied by the client.</text>
  <text class="note" x="42" y="964">A System Admin can add, rename, reorder or re-grant a page at runtime, with no redeploy —</text>
  <text class="note" x="42" y="982">which is why the sidebar is data, not code.</text>

  <rect class="nbox" x="822" y="800" width="812" height="200" rx="3"/>
  <text class="key"  x="842" y="828">Two grants that prove the mechanism is real</text>
  <text class="warn" x="842" y="858">A Logistics head sees only the Logistics dropdown page, never Sound &amp; Light. Each option list is</text>
  <text class="warn" x="842" y="876">granted to the one department that owns it, because a uniform grant would put a link on screen</text>
  <text class="warn" x="842" y="894">that the API would then refuse on click.</text>
  <text class="warn" x="842" y="924">A Cafeteria Manager holds Inbox, Ongoing and History but never Drafts or Forms. They review</text>
  <text class="warn" x="842" y="942">food orders and never submit proposals, so the pages that create a proposal are not granted —</text>
  <text class="warn" x="842" y="960">the same distinction the workflow itself enforces in Fig. 6.</text>
