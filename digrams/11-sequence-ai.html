<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence — AI assistant query</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#fff}
  body{display:flex;justify-content:center;padding:24px 18px}
  svg{width:100%;max-width:1520px;height:auto;display:block}

  .ll   {font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;fill:#141A20}
  .ll-s {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:9px;fill:#8A939D}
  .msg  {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.5px;fill:#243039}
  .ret  {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11.5px;fill:#5A6672}
  .frag {font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;fill:#27456F}
  .cond {font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:11px;fill:#4E6A93}
  .note {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:10.5px;fill:#8A939D}
  .warn {font-family:"IBM Plex Mono",monospace;font-weight:400;font-size:11px;fill:#8E3A22}
  .phase{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;fill:#4E6A93}
  .tx   {font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;fill:#8E3A22}

  .head {fill:#E4EAF2;stroke:#27456F;stroke-width:1.5}
  .head-x{fill:#FFFFFF;stroke:#C08670;stroke-width:1.5;stroke-dasharray:6 4}
  .life {stroke:#8FA0B4;stroke-width:1.2;stroke-dasharray:5 5}
  .actv {fill:#FFFFFF;stroke:#27456F;stroke-width:1.3}
  .call {stroke:#27456F;stroke-width:1.5;fill:none}
  .back {stroke:#7C8DA1;stroke-width:1.3;fill:none;stroke-dasharray:6 4}
  .bad  {stroke:#C08670;stroke-width:1.5;fill:none;stroke-dasharray:6 4}
  .fr   {fill:none;stroke:#27456F;stroke-width:1.4}
  .fr-x {fill:none;stroke:#8E3A22;stroke-width:1.5}
  .nbox {fill:#FFFDF9;stroke:#C08670;stroke-width:1.3}
  .pl   {stroke:#AFBAC4;stroke-width:1;stroke-dasharray:3 3}
</style>
</head>
<body>

<svg viewBox="0 0 1520 1300" role="img"
     aria-label="Sequence diagram: AI assistant text-to-SQL pipeline with guard and bounded retry">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#27456F"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7C8DA1" stroke-width="1.4"/></marker>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#C08670" stroke-width="1.5"/></marker>
  </defs>

  <!-- ══════ LIFELINES ══════ -->
  <rect class="head" x="20"   y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="85"  y="62" text-anchor="middle">Client</text>
  <text class="ll-s" x="85"  y="78" text-anchor="middle">ai-orb widget</text>
  <line class="life" x1="85" y1="90" x2="85" y2="1270"/>

  <rect class="head" x="180"  y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="245" y="62" text-anchor="middle">api/ai</text>
  <text class="ll-s" x="245" y="78" text-anchor="middle">POST /ai/ask</text>
  <line class="life" x1="245" y1="90" x2="245" y2="1270"/>

  <rect class="head" x="340"  y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="405" y="62" text-anchor="middle">Classifier</text>
  <text class="ll-s" x="405" y="78" text-anchor="middle">ai/classifier</text>
  <line class="life" x1="405" y1="90" x2="405" y2="1270"/>

  <rect class="head-x" x="500" y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="565" y="62" text-anchor="middle" fill="#8E3A22">Gemini</text>
  <text class="ll-s" x="565" y="78" text-anchor="middle">external</text>
  <line class="life" x1="565" y1="90" x2="565" y2="1270"/>

  <rect class="head" x="660"  y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="725" y="62" text-anchor="middle">Topic access</text>
  <text class="ll-s" x="725" y="78" text-anchor="middle">ai/topic_access</text>
  <line class="life" x1="725" y1="90" x2="725" y2="1270"/>

  <rect class="head" x="820"  y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="885" y="62" text-anchor="middle">Scope</text>
  <text class="ll-s" x="885" y="78" text-anchor="middle">ai/scope_rules</text>
  <line class="life" x1="885" y1="90" x2="885" y2="1270"/>

  <rect class="head" x="980"  y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="1045" y="62" text-anchor="middle">Schema</text>
  <text class="ll-s" x="1045" y="78" text-anchor="middle">schema_catalog</text>
  <line class="life" x1="1045" y1="90" x2="1045" y2="1270"/>

  <rect class="head" x="1140" y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="1205" y="62" text-anchor="middle">Guard</text>
  <text class="ll-s" x="1205" y="78" text-anchor="middle">ai/sql_guard</text>
  <line class="life" x1="1205" y1="90" x2="1205" y2="1270"/>

  <rect class="head" x="1300" y="40" width="130" height="50" rx="2"/>
  <text class="ll"   x="1365" y="62" text-anchor="middle">Runner + DB</text>
  <text class="ll-s" x="1365" y="78" text-anchor="middle">ai/sql_runner</text>
  <line class="life" x1="1365" y1="90" x2="1365" y2="1270"/>

  <!-- ══════ classify ══════ -->
  <text class="phase" x="20" y="124">1 · Classify — the model decides the topic, not a regex</text>
  <line class="pl" x1="20" y1="134" x2="1490" y2="134"/>

  <rect class="actv" x="80"  y="156" width="10" height="1050"/>
  <rect class="actv" x="240" y="158" width="10" height="1040"/>
  <rect class="actv" x="400" y="188" width="10" height="112"/>

  <path class="call" d="M90,166 H240" marker-end="url(#a)"/>
  <text class="msg" x="100" y="160">ask a question</text>

  <path class="call" d="M250,196 H400" marker-end="url(#a)"/>
  <text class="msg" x="262" y="190">classify(question, recent turns)</text>

  <path class="call" d="M410,228 H560" marker-end="url(#a)"/>
  <text class="msg" x="422" y="222">prompt with the class vocabulary</text>
  <text class="note" x="422" y="240">recent turns resolve bare follow-ups</text>

  <path class="back" d="M560,272 H410" marker-end="url(#ao)"/>
  <text class="ret" x="422" y="266">topic classes</text>

  <!-- ══════ authorize ══════ -->
  <text class="phase" x="20" y="330">2 · Authorize before anything is described to the model</text>
  <line class="pl" x1="20" y1="340" x2="1490" y2="340"/>

  <rect class="actv" x="720" y="362" width="10" height="70"/>
  <rect class="actv" x="880" y="452" width="10" height="70"/>
  <rect class="actv" x="1040" y="542" width="10" height="70"/>

  <path class="call" d="M250,370 H720" marker-end="url(#a)"/>
  <text class="msg" x="262" y="364">may this caller see this topic?</text>

  <path class="back" d="M720,412 H250" marker-end="url(#ao)"/>
  <text class="ret" x="262" y="406">permitted topics — denied ones are dropped here</text>

  <path class="call" d="M250,460 H880" marker-end="url(#a)"/>
  <text class="msg" x="262" y="454">derive row-level scope for this principal</text>

  <path class="back" d="M880,502 H250" marker-end="url(#ao)"/>
  <text class="ret" x="262" y="496">scope predicates</text>

  <path class="call" d="M250,550 H1040" marker-end="url(#a)"/>
  <text class="msg" x="262" y="544">describe only the tables this scope permits</text>

  <path class="back" d="M1040,592 H250" marker-end="url(#ao)"/>
  <text class="ret" x="262" y="586">introspected schema — never remembered structure</text>

  <rect class="nbox" x="262" y="606" width="470" height="54" rx="2"/>
  <text class="warn" x="278" y="626">Scope precedes schema, so an unauthorised table is never</text>
  <text class="warn" x="278" y="644">named to the model in the first place.</text>

  <!-- ══════ generate + guard ══════ -->
  <text class="phase" x="20" y="700">3 · Generate, then guard — never the other way round</text>
  <line class="pl" x1="20" y1="710" x2="1490" y2="710"/>

  <!-- loop fragment -->
  <rect class="fr" x="200" y="730" width="1270" height="300" rx="2"/>
  <path class="fr" d="M200,730 H286 L302,748 V758 H200"/>
  <text class="frag" x="212" y="750">loop</text>
  <text class="cond" x="316" y="750">[attempt &#8804; MAX_ATTEMPTS]</text>

  <rect class="actv" x="560" y="770" width="10" height="60"/>
  <rect class="actv" x="1200" y="860" width="10" height="70"/>

  <path class="call" d="M250,778 H560" marker-end="url(#a)"/>
  <text class="msg" x="262" y="772">generate SQL from the permitted schema</text>

  <path class="back" d="M560,820 H250" marker-end="url(#ao)"/>
  <text class="ret" x="262" y="814">candidate SQL</text>

  <path class="call" d="M250,868 H1200" marker-end="url(#a)"/>
  <text class="msg" x="262" y="862">validate(sql, scope)</text>

  <path class="bad" d="M1200,910 H250" marker-end="url(#ax)"/>
  <text class="warn" x="262" y="904">repairable fault — bad column, missing predicate, syntax</text>

  <path class="call" d="M250,960 H560" marker-end="url(#a)"/>
  <text class="msg" x="262" y="954">retry with the exact reason appended</text>
  <text class="note" x="262" y="990">the fault is fed back verbatim; nothing is re-guessed</text>

  <!-- ══════ authorization break ══════ -->
  <rect class="fr-x" x="200" y="1050" width="1270" height="106" rx="2"/>
  <path class="fr-x" d="M200,1050 H300 L316,1068 V1078 H200"/>
  <text class="tx" x="212" y="1070">break</text>
  <text class="cond" x="330" y="1070" fill="#8E3A22">[guard reports an authorization violation]</text>

  <path class="bad" d="M1200,1104 H250" marker-end="url(#ax)"/>
  <text class="warn" x="262" y="1098">refuse · log to ai_access_denial · do NOT retry</text>
  <text class="warn" x="262" y="1140">Re-asking a model that just tried to read someone else&#39;s rows is the loop an attacker would drive.</text>

  <!-- ══════ execute ══════ -->
  <text class="phase" x="20" y="1204">4 · Execute only what the guard passed</text>
  <line class="pl" x1="20" y1="1214" x2="1490" y2="1214"/>

  <rect class="actv" x="1360" y="1230" width="10" height="40"/>

  <path class="call" d="M250,1238 H1360" marker-end="url(#a)"/>
  <text class="msg" x="262" y="1232">execute the validated statement</text>

  <path class="back" d="M240,1266 H90" marker-end="url(#ao)"/>
  <text class="ret" x="262" y="1262">answered · no rows · cannot answer — three distinct replies</text>

</svg>
</body>
</html>
