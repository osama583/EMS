<!DOCTYPE html>
<html lang="en">
<head>
<!--
Shared HTML email shell. Table-based layout for client compatibility
(Outlook/Gmail strip <style> in some contexts — inline styles are load-bearing).
Placeholders: {{subject}} {{preheader}} {{body_html}} {{cta_label}} {{cta_link}}
{{cta_html}} is the whole button block, blank string when an email has no action.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<title>{{subject}}</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <!-- preheader, hidden -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{preheader}}</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#ffffff; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid rgba(15,35,60,0.10);">

          <!-- header -->
          <!-- TODO: confirm hosted icon URL before go-live; must be a public https URL, not a local asset path -->
          <tr>
            <td style="background-color:#ffffff; padding:20px 32px; border-bottom:1px solid rgba(15,35,60,0.10);">
              <table role="presentation" cellpadding="0" cellspacing="0"><tr>
                <td width="26" style="padding-right:10px;">
                  <img src="https://YOUR-DOMAIN/assets/media/apu-logo-only.png" alt="" width="26" height="26" style="display:block; border:0;">
                </td>
                <td align="left" style="font-size:15px; font-weight:800; color:#07182c; letter-spacing:0.2px; font-family:Roboto,Arial,Helvetica,sans-serif;">
                  APU Event Management System
                </td>
              </tr></table>
            </td>
          </tr>

          <!-- accent rule -->
          <tr>
            <td style="height:3px; background-color:#2a83ff; font-size:0; line-height:0;">&nbsp;</td>
          </tr>

          <!-- body -->
          <tr>
            <td style="padding:36px 32px 8px 32px; color:#07182c; font-size:15px; line-height:1.6; font-family:Roboto,Arial,Helvetica,sans-serif;">
              {{body_html}}
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td style="padding:8px 32px 36px 32px;">
              {{cta_html}}
            </td>
          </tr>

          <!-- footer -->
          <tr>
            <td style="padding:20px 32px; background-color:#f4f7fa; border-top:1px solid rgba(15,35,60,0.12);">
              <p style="margin:0; font-size:12px; line-height:1.6; color:#5f6d7f; font-family:Roboto,Arial,Helvetica,sans-serif;">
                This is an automated message from APU Event Management. Please do not reply directly to this email.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
