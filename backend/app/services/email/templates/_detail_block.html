<!--
Reusable "structured facts" block (schedule, credentials, requirement, etc.)
Dark navy for contrast against the white body. Table-based for Outlook.
Repeat the inner <tr> per row; {{label}}/{{value}} per pair.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background-color:#07182c; border-radius:8px; margin:4px 0 16px;">
  <tr>
    <td style="padding:14px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:13px; font-family:Roboto,Arial,Helvetica,sans-serif;">
        <tr>
          <td style="padding:3px 0; color:#8fc0ff; width:90px; vertical-align:top;">{{label}}</td>
          <td style="padding:3px 0; color:#ffffff; font-weight:600;">{{value}}</td>
        </tr>
        <!-- repeat <tr> per additional row -->
      </table>
    </td>
  </tr>
</table>
