<app-internal-data-page
  [config]="pageConfig()"
  [records]="sharedRecords()"
  [filters]="filterConfigs()"
  [searchValue]="search()"
  [loading]="loading()"
  [totalPages]="totalPages()"
  [page]="page()"
  [pageSize]="pageSize()"
  [sort]="sort()"
  (searchChange)="updateSearchDraft($event)"
  (filterChange)="updateFilter($event)"
  (reset)="resetFilters()"
  (pageChange)="updatePage($event)"
  (pageSizeChange)="updatePageSize($event)"
  (rowAction)="handleRowAction($event)"
  (recordOpen)="openRecord($event)"
  (sortChange)="updateSort($event)"
/>
