<section class="cafeteria-staff-assignments">
  <app-feedback-banner [message]="errorMessage()" tone="error" />

  <nav class="shared-tabs" aria-label="Sections">
    <button type="button" class="shared-tabs__tab" [class.shared-tabs__tab--active]="!showDeleted()" (click)="setDeletedTab(false)">
      <span class="material-symbols-rounded" aria-hidden="true">badge</span>
      Assignments
    </button>
    <button type="button" class="shared-tabs__tab" [class.shared-tabs__tab--active]="showDeleted()" (click)="setDeletedTab(true)">
      <span class="material-symbols-rounded" aria-hidden="true">delete</span>
      Deleted
    </button>
  </nav>

  @if (showDeleted()) {
    <app-internal-data-page
      [config]="deletedConfig()" [records]="deletedRecords()" [filters]="[]" [searchValue]="''" [loading]="deletedLoading()"
      [totalPages]="1" [page]="1" [pageSize]="50" [hideControls]="true"
      (rowAction)="handleDeletedAction($event)"
    />
  } @else {
    <app-internal-data-page
      [config]="config()" [records]="records()" [filters]="filters()" [searchValue]="search()" [loading]="loading()"
      [totalPages]="totalPages()" [page]="page()" [pageSize]="pageSize()"
      (searchChange)="setSearch($event)" (filterChange)="setFilter($event)" (reset)="reset()"
      (pageChange)="setPage($event)" (pageSizeChange)="setPageSize($event)" (rowAction)="handleAction($event)"
      (recordOpen)="handleAction({ action: { key: 'edit', label: 'Edit', icon: 'edit' }, record: $event })" (primaryAction)="openAdd()"
    />
  }
</section>

<app-form-modal [open]="modalOpen()" [title]="editingAssignmentId() ? 'Edit Assignment' : 'Add Assignment'" [primaryLabel]="editingAssignmentId() ? 'Save Changes' : 'Add Assignment'" [loading]="saving()" [disabled]="!formValid()" (close)="closeModal()" (cancel)="closeModal()" (submit)="save()">
  <div class="cafeteria-staff-assignments__form">
    <app-form-field controlId="assignment-name" label="Full Name" [required]="true" [value]="value('displayName')" (valueChange)="setDraft('displayName', $event)" />
    <app-form-field controlId="assignment-email" label="Email" type="email" [required]="true" [value]="value('email')" (valueChange)="setDraft('email', $event)" />
    <app-form-field controlId="assignment-password" label="Password" type="password" [value]="value('password')" [hint]="passwordHint()" (valueChange)="setDraft('password', $event)" />
    <app-status-toggle [active]="$any(draft()['userActive'])" label="Active user" description="Inactive users remain listed but cannot sign in." (activeChange)="setDraft('userActive', $event)" />
    <app-searchable-dropdown
      controlId="assignment-cafeteria" label="Cafeteria" placeholder="Select a cafeteria…" [required]="true" [clearable]="false"
      [options]="cafeteriaOptions()" [value]="selectedCafeteriaCode()" (valueChange)="selectCafeteria($event)"
    />
    <app-searchable-dropdown
      controlId="assignment-role" label="Role" placeholder="Select a role…" [required]="true" [clearable]="false"
      [options]="roleOptions" [value]="selectedRoleCode()" (valueChange)="selectRole($event)"
    />
    @if (managerConflict(); as conflict) {
      <p class="cafeteria-staff-assignments__conflict">
        {{ conflict.cafeteriaName }} already has a Cafeteria Manager ({{ conflict.displayName }}). Remove that assignment first.
      </p>
    }
  </div>
</app-form-modal>

<app-delete-confirm-dialog
  [open]="!!deleteTarget()" entityKind="Assignment" [entityLabel]="targetLabel()"
  [checkingDependencies]="checkingDeletion()" [preview]="deletePreview()" [deleting]="deleting()"
  (confirm)="confirmRemove()" (cancel)="cancelRemove()"
/>

<app-confirm-dialog
  [open]="restoreTarget() !== null"
  title="Restore assignment"
  [message]="restoreMessage()"
  confirmLabel="Restore"
  [danger]="false"
  (confirm)="confirmRestore()"
  (cancel)="cancelRestore()"
/>
